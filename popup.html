<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=720, height=600" />
    <title>FutureContext</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="FutureContext">
      <header class="app-header">
        <button class="brand" type="button" data-action="home" aria-label="返回资料库">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M23.9 8.8A11.2 11.2 0 1 0 24 23.1"/><path d="M22.2 16h6.3"/></svg>
          <span>FutureContext</span>
        </button>
        <button class="icon-button" type="button" data-action="settings" aria-label="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="m19.4 13.5 1.1.8-2 3.4-1.3-.5a7.4 7.4 0 0 1-1.8 1l-.2 1.4h-4l-.2-1.4a7.6 7.6 0 0 1-1.8-1l-1.3.5-2-3.4 1.1-.8a7.8 7.8 0 0 1 0-2.1l-1.1-.8 2-3.4 1.3.5a7.6 7.6 0 0 1 1.8-1l.2-1.4h4l.2 1.4a7.4 7.4 0 0 1 1.8 1l1.3-.5 2 3.4-1.1.8a7.8 7.8 0 0 1 0 2.1Z"/></svg>
        </button>
      </header>
      <section id="app" class="app-content" aria-live="polite"></section>
    </main>

    <input id="backup-input" type="file" accept="application/json,.json" hidden />
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <dialog id="confirm-dialog" class="confirm-dialog">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-description"></p>
        <div class="dialog-actions">
          <button class="button button-ghost" value="cancel">取消</button>
          <button id="confirm-action" class="button button-danger" value="confirm">确认</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="popup.js"></script>
  </body>
</html>
